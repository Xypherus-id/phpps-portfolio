<style>
  :root {
    --bg: #f6f7fb;
    --card: #ffffff;
    --ink: #1f2433;
    --muted: #5d6478;
    --line: #e2e5ee;
    --brand: #23507a;
    --brand-soft: #e7eff7;
    --accent: #f2a541;
    --ok: #2e7d4f;   --ok-soft: #e4f3ea;
    --view: #2b62a8; --view-soft: #e5eefa;
    --edit: #6a43a8; --edit-soft: #efe8fa;
    --none: #7a7f8c; --none-soft: #eef0f3;
    --warn: #8a5a00; --warn-soft: #fff4dc;
    --flag: #a12b2b; --flag-soft: #fbe9e9;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .topbar {
    display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between;
    padding: 12px 20px; background: var(--brand); color: #fff;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: var(--brand);
    display: grid; place-items: center; font-weight: 800; font-size: 20px;
  }
  .brand-title { font-weight: 700; font-size: 17px; }
  .brand-sub { font-size: 12px; opacity: .85; }
  .switcher { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .switcher label { font-size: 13px; font-weight: 600; opacity: .9; }
  .switcher select {
    font: inherit; padding: 6px 10px; border-radius: 8px; border: 0; min-width: 170px; max-width: 100%;
    color: var(--ink); background: #fff;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
  .loading { color: var(--muted); }
  .banner { max-width: 1100px; margin: 12px auto 0; padding: 10px 14px; border-radius: 8px; }
  .banner-warn { background: var(--warn-soft); color: var(--warn); border: 1px solid #f0d9a6; }
  .error { background: var(--flag-soft); color: var(--flag); padding: 12px 14px; border-radius: 8px; }

  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px;
  }
  .card h2 { margin: 0 0 6px; font-size: 16px; }
  .card h3 { margin: 0 0 4px; font-size: 15px; }
  .kicker { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  .big { font-size: 28px; font-weight: 700; }
  .muted { color: var(--muted); }
  .section-gap { margin-top: 20px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip { border-radius: 999px; padding: 4px 10px; font-size: 13px; border: 1px solid transparent; }
  .chip b { font-weight: 600; }
  .chip-E, .chip-E-own { background: var(--edit-soft); color: var(--edit); }
  .chip-C, .chip-C-subject { background: var(--ok-soft); color: var(--ok); }
  .chip-V, .chip-V-subject, .chip-V-released, .chip-A, .chip-export { background: var(--view-soft); color: var(--view); }
  .chip-N, .chip-None { background: var(--none-soft); color: var(--none); }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .toolbar input {
    font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; min-width: 220px; max-width: 100%;
  }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: #fafbfd; }
  tr:hover td { background: #fafbfd; }
  .restricted { color: var(--flag); font-weight: 600; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: var(--ok-soft); color: var(--ok); }

  .hero {
    background: linear-gradient(135deg, #2c6aa0, #23507a); color: #fff; border-radius: var(--radius); padding: 22px 24px;
  }
  .hero h1 { margin: 0 0 4px; font-size: 24px; }
  .section-card { border-top: 4px solid var(--accent); }
  .section-card .icon { font-size: 22px; font-weight: 700; color: var(--brand); }

  .foot { max-width: 1100px; margin: 0 auto; padding: 0 16px 24px; font-size: 12px; color: var(--muted); }

  @media (max-width: 640px) {
    .switcher select { min-width: 0; flex: 1 1 140px; }
    .topbar { padding: 12px 16px; }
  }
</style>
